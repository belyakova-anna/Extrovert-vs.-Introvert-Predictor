version: "3.9"

services:
  api:
    build:
      context: ../..
      dockerfile: code/deployment/api/Dockerfile
    container_name: introverts_api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  app:
    build:
      context: ../..
      dockerfile: code/deployment/app/Dockerfile
    container_name: introverts_app
    depends_on:
      - api
    environment:
      - PYTHONUNBUFFERED=1
      - API_BASE_URL=http://api:8000
    ports:
      - "8501:8501"
    restart: unless-stopped
